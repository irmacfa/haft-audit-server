<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>سامانه انبارگردانی تجهیزات انفورماتیک فروشگاه هفت</title>
    <link rel="icon" type="image/webp" href="/logo.webp">
    <style>
        @font-face {
            font-family: IRANSansX;
            src: url('/fonts/IRANSansX-Regular.woff2') format('woff2'), url('/fonts/IRANSansX-Regular.woff') format('woff');
            font-display: swap;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: IRANSansX, Tahoma, sans-serif;
            color: #182033;
            background:
                radial-gradient(circle at 18% 12%, rgba(255,255,255,.95) 0, transparent 42%),
                radial-gradient(circle at 88% 88%, rgba(203,220,245,.75) 0, transparent 46%),
                linear-gradient(145deg, #f7f9fc 0%, #eaf0f8 100%);
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: rgba(255,255,255,.94);
            border: 1px solid #e3e9f2;
            border-radius: 26px;
            padding: 34px 30px 30px;
            box-shadow: 0 22px 60px rgba(23,45,90,.10), inset 0 1px 0 rgba(255,255,255,.9);
            backdrop-filter: blur(6px);
        }
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            margin-bottom: 26px;
        }
        .brand .logo {
            width: min(300px, 72vw);
            height: auto;
            display: block;
            filter: drop-shadow(0 8px 16px rgba(11,47,148,.16));
        }
        h1 {
            font-size: 17px;
            line-height: 1.7;
            margin: 0;
            font-weight: 600;
            color: #141b2c;
        }
        .sub { color: #758095; font-size: 12px; margin-top: 2px; }
        label { display: block; font-size: 13px; margin: 16px 0 7px; color: #3b4354; font-weight: 500; }
        input[type=text], input[type=password] {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            background: #f8fafc;
            color: #182033;
            border: 1px solid #d9dfeb;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }
        input::placeholder { color: #a6aebe; }
        input:focus {
            border-color: #0b2f96;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(11,47,148,.10);
        }
        .row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 12px; color: #758095; gap: 10px; }
        .row label { margin: 0; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; color: #5b6475; }
        .row input[type=checkbox] { accent-color: #0b2f96; width: 15px; height: 15px; }
        button {
            width: 100%;
            min-height: 46px;
            margin-top: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #0b2f96 0%, #1450c8 100%);
            color: #fff;
            border: 0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(11,47,148,.22);
            transition: transform .2s, filter .2s, opacity .2s;
        }
        button:hover { filter: brightness(1.06); }
        button:active { transform: scale(.98); }
        button:disabled { opacity: .75; cursor: wait; }
        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.45);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .progress {
            display: none;
            height: 3px;
            margin-top: 14px;
            background: #e7ecf5;
            border-radius: 999px;
            overflow: hidden;
        }
        .progress span {
            display: block;
            height: 100%;
            width: 35%;
            border-radius: 999px;
            background: linear-gradient(90deg, #0b2f96, #3b82f6);
            animation: slide 1.05s infinite ease-in-out;
        }
        @keyframes slide {
            0% { transform: translateX(-110%); }
            100% { transform: translateX(390%); }
        }
        .error {
            display: none;
            margin-top: 16px;
            padding: 11px 13px;
            background: #fff1f2;
            border: 1px solid #fecdd3;
            border-radius: 10px;
            color: #9f1239;
            font-size: 12.5px;
            line-height: 1.7;
        }
        @media (max-width: 480px) {
            body { padding: 14px; }
            .card { padding: 26px 20px 22px; border-radius: 20px; }
            .brand .logo { width: min(250px, 68vw); }
            h1 { font-size: 15px; }
            input[type=text], input[type=password], button { height: 48px; min-height: 48px; }
            .row { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <img src="/logo.webp" alt="لوگوی هفت" class="logo">
            <div>
                <h1>سامانه انبارگردانی تجهیزات انفورماتیک فروشگاه هفت</h1>
                <div class="sub">ورود ایمن به سامانه</div>
            </div>
        </div>

        <form id="loginForm" autocomplete="on">
            <label for="username">نام کاربری</label>
            <input id="username" name="username" type="text" autocomplete="username" dir="ltr"
                   placeholder="نام کاربری خود را وارد کنید" required>

            <label for="password">رمز عبور</label>
            <input id="password" name="password" type="password" autocomplete="current-password"
                   dir="ltr" placeholder="••••••••" required>

            <div class="row">
                <label><input id="remember" type="checkbox"> مرا به خاطر بسپار (۷ روز)</label>
                <span>ورود امن</span>
            </div>

            <button id="submitBtn" type="submit">
                <span id="btnLabel">ورود به سامانه</span>
                <span id="btnSpinner" class="spinner" aria-hidden="true"></span>
            </button>
            <div id="loginProgress" class="progress"><span></span></div>
        </form>

        <div id="error" class="error" role="alert" aria-live="polite"></div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');
        const btnLabel = document.getElementById('btnLabel');
        const btnSpinner = document.getElementById('btnSpinner');
        const progress = document.getElementById('loginProgress');

        function safeNext() {
            const n = new URLSearchParams(location.search).get('next') || '/';
            return (n.startsWith('/') && !n.startsWith('//')) ? n : '/';
        }

        function showError(message) {
            errorBox.textContent = message;
            errorBox.style.display = 'block';
        }

        function setLoading(loading) {
            submitBtn.disabled = loading;
            submitBtn.setAttribute('aria-busy', loading ? 'true' : 'false');
            btnLabel.textContent = loading ? 'در حال بررسی...' : 'ورود به سامانه';
            btnSpinner.style.display = loading ? 'block' : 'none';
            progress.style.display = loading ? 'block' : 'none';
        }

        fetch('/api/auth/me', { credentials: 'same-origin' })
            .then(r => r.json())
            .then(j => { if (j.authenticated) location.replace(safeNext()); })
            .catch(() => {});

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';
            setLoading(true);
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value,
                        remember: document.getElementById('remember').checked
                    })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.ok) {
                    showError(data.error || 'ورود ناموفق بود. لطفاً دوباره تلاش کنید.');
                    return;
                }
                location.replace(safeNext());
            } catch (err) {
                showError('ارتباط با سرور برقرار نشد.');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
