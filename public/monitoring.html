<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مانیتورینگ انبارگردانی</title>
    <link rel="icon" type="image/webp" href="/logo.webp">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="vibefarsi.css">
    <link rel="stylesheet" href="design.css">
    <link rel="stylesheet" href="/panel-theme.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-card { transition: all 0.3s ease; }
        .status-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="panel-body text-slate-800 min-h-screen p-3 sm:p-5">

    <header class="mb-6 flex flex-col lg:flex-row justify-between items-center bg-white p-6 rounded-3xl shadow-lg border border-slate-200 gap-4">
        <div class="flex items-center gap-3">
            <img src="/logo.webp" alt="هفت" class="h-10 w-auto object-contain">
            <h1 class="text-xl font-bold text-slate-900">مانیتورینگ وضعیت انبارگردانی</h1>
        </div>
        <div class="flex flex-wrap items-center gap-2">
            <select id="regionFilter" onchange="onMonitorRegionChange()" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-orange-500">
                <option value="all">همه مناطق</option>
            </select>
            <input type="text" id="searchInput" oninput="filterStores()" placeholder="جستجوی کد یا نام فروشگاه..." class="bg-white border border-slate-200 rounded-xl px-4 py-2 w-full md:w-56 text-xs focus:outline-none focus:border-orange-500">
            <a href="/api/monitoring/export" class="bg-sky-700 hover:bg-sky-600 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap">📥 اکسل کلی</a>
            <button onclick="loadMonitoring()" class="bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-xl text-xs font-bold">🔄 بروزرسانی</button>
            <button onclick="window.location.href='/'" class="bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-xl text-xs font-bold">بازگشت به پنل</button>
            <a data-admin-only data-admin-link="/" href="#" class="hidden bg-indigo-700 hover:bg-indigo-600 px-4 py-2 rounded-xl text-xs font-bold">🛡️ پنل مدیریت</a>
            <span data-user-only id="userBadge" class="bg-slate-100 border border-slate-300 px-3 py-2 rounded-xl text-xs font-bold" title="">👤 <span data-user-name>...</span></span>
            <button data-user-only data-logout type="button" class="bg-rose-700 hover:bg-rose-600 px-4 py-2 rounded-xl text-xs font-bold">🚪 خروج</button>
            <a data-guest-only href="/login.html" class="hidden bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded-xl text-xs font-bold">🔐 ورود به سامانه</a>
        </div>
    </header>

    <!-- شمارنده وضعیتها -->
    <div class="grid grid-cols-3 gap-4 mb-8 w-full">
        <div class="bg-emerald-50 border border-emerald-600 rounded-2xl p-4 text-center">
            <p class="text-2xl font-bold text-emerald-700" id="countDone">۰</p>
            <p class="text-xs text-emerald-700 mt-1">تکمیل شده</p>
        </div>
        <div class="bg-amber-50 border border-amber-600 rounded-2xl p-4 text-center">
            <p class="text-2xl font-bold text-amber-700" id="countProgress">۰</p>
            <p class="text-xs text-amber-700 mt-1">در حال انجام</p>
        </div>
        <div class="bg-rose-50 border border-rose-600 rounded-2xl p-4 text-center">
            <p class="text-2xl font-bold text-rose-700" id="countPending">۰</p>
            <p class="text-xs text-rose-700 mt-1">در انتظار</p>
        </div>
    </div>

    <!-- پیشرفت مناطق -->
    <div class="w-full mb-8 bg-white border border-slate-200 rounded-3xl p-5 shadow-xl">
        <div class="flex flex-wrap justify-between items-center gap-2 mb-4">
            <h2 class="text-sm font-bold text-slate-900">📈 پیشرفت انبارگردانی به تفکیک منطقه</h2>
            <div class="flex items-center gap-2">
                <span id="regionHint" class="text-[10px] text-slate-500">برای فیلتر، روی منطقه کلیک کنید</span>
                <button onclick="resetMonitorRegion()" class="bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-[11px] font-bold">↺ نمایش همه</button>
            </div>
        </div>
        <div id="regionProgress" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3"></div>
    </div>

    <!-- پیشرفت به تفکیک کارشناس -->
    <div class="w-full mb-8 bg-white border border-slate-200 rounded-3xl p-5 shadow-xl">
        <div class="flex flex-wrap justify-between items-center gap-2 mb-4">
            <h2 class="text-sm font-bold text-slate-900">👷 پیشرفت انبارگردانی به تفکیک کارشناس</h2>
            <span class="text-[10px] text-slate-500">بر اساس آخرین انبارگردان ثبتشده هر فروشگاه</span>
        </div>
        <div id="expertProgress" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3"></div>
    </div>

    <div id="statsGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3"></div>

    <script>
        let allStores = [];

        async function loadMonitoring() {
            try {
                const res = await fetch('/api/monitoring/status');
                if (res.status === 202) {
                    document.getElementById('statsGrid').innerHTML = `<div class="col-span-full text-center py-16 text-amber-700 bg-white rounded-2xl border border-slate-200">در حال آماده‌سازی فایل مادر... لطفاً چند ثانیه صبر کنید.</div>`;
                    return;
                }
                const data = await res.json();
                allStores = (Array.isArray(data) ? data : []).sort((a, b) => a.plant.localeCompare(b.plant));

                // پر کردن لیست مناطق
                const select = document.getElementById('regionFilter');
                const current = select.value;
                const regions = [...new Set(allStores.map(s => s.region).filter(Boolean))];
                select.innerHTML = '<option value="all">همه مناطق</option>' +
                    regions.map(r => `<option value="${r}">${r}</option>`).join('');
                select.value = current || 'all';

                filterStores();
            } catch (e) {
                document.getElementById('statsGrid').innerHTML = `<div class="col-span-full text-center py-20 text-rose-700">خطا: ${e.message}</div>`;
            }
        }

        function filterStores() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const region = document.getElementById('regionFilter').value;
            const filtered = allStores.filter(s =>
                (region === 'all' || s.region === region) &&
                (s.plant.includes(query) || s.storeName.toLowerCase().includes(query))
            );

            document.getElementById('countDone').innerText = filtered.filter(s => s.isLocked).length;
            document.getElementById('countProgress').innerText = filtered.filter(s => !s.isLocked && s.auditor).length;
            document.getElementById('countPending').innerText = filtered.filter(s => !s.isLocked && !s.auditor).length;

            renderRegionProgress();
            renderExpertProgress(filtered);
            renderGrid(filtered);
        }

        function renderRegionProgress() {
            const box = document.getElementById('regionProgress');
            const byRegion = {};
            allStores.forEach(s => {
                const r = s.region || 'سایر';
                if (!byRegion[r]) byRegion[r] = { total: 0, done: 0, progress: 0 };
                byRegion[r].total++;
                if (s.isLocked) byRegion[r].done++;
                else if (s.auditor) byRegion[r].progress++;
            });

            box.innerHTML = Object.entries(byRegion).map(([name, v]) => {
                const pct = v.total ? Math.round(v.done / v.total * 100) : 0;
                const barColor = pct === 100 ? 'bg-emerald-500' : pct >= 50 ? 'bg-sky-500' : 'bg-orange-500';
                const active = document.getElementById('regionFilter').value === name;
                return `
                    <button onclick="toggleMonitorRegion('${name}')"
                        class="text-right bg-white border ${active ? 'border-orange-500 ring-2 ring-orange-500/40' : 'border-slate-200 hover:border-orange-500/60'} rounded-2xl p-3 transition-all hover:-translate-y-0.5 cursor-pointer">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold ${active ? 'text-orange-700' : 'text-slate-900'}">${active ? '▶ ' : ''}${name}</span>
                            <span class="text-xs font-bold ${pct === 100 ? 'text-emerald-700' : 'text-orange-700'}">${pct}٪</span>
                        </div>
                        <div class="w-full bg-white h-2 rounded-full overflow-hidden border border-slate-200">
                            <div class="${barColor} h-full transition-all duration-500" style="width:${pct}%"></div>
                        </div>
                        <p class="text-[10px] text-slate-500 mt-2">${v.done} تکمیل · ${v.progress} در حال اجرا · ${v.total} کل</p>
                    </button>
                `;
            }).join('');
        }

        function renderExpertProgress(stores) {
            const box = document.getElementById('expertProgress');
            const byExpert = {};
            stores.forEach(s => {
                const name = s.auditor || 'انبارگردان نامشخص';
                if (!byExpert[name]) byExpert[name] = { total: 0, done: 0, progress: 0 };
                byExpert[name].total++;
                if (s.isLocked) byExpert[name].done++;
                else if (s.auditor) byExpert[name].progress++;
            });
            const entries = Object.entries(byExpert).sort((a, b) => b[1].done - a[1].done);
            if (!entries.length) {
                box.innerHTML = '<p class="text-xs text-slate-400 col-span-full">کارشناسی یافت نشد.</p>';
                return;
            }
            box.innerHTML = entries.map(([name, v]) => {
                const pct = v.total ? Math.round(v.done / v.total * 100) : 0;
                const barColor = pct === 100 ? 'bg-emerald-500' : pct >= 50 ? 'bg-sky-500' : 'bg-orange-500';
                return `
                    <div class="bg-slate-900/50 border border-slate-700/60 rounded-2xl p-3">
                        <div class="flex justify-between items-center gap-2 mb-2">
                            <span class="text-xs font-bold text-slate-100 truncate" title="${escapeHtml(name)}">👤 ${escapeHtml(name)}</span>
                            <span class="text-xs font-bold ${pct === 100 ? 'text-emerald-400' : 'text-amber-400'}">${pct}٪</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden border border-slate-700">
                            <div class="${barColor} h-full transition-all duration-500" style="width:${pct}%"></div>
                        </div>
                        <p class="text-[10px] text-slate-400 mt-2">${v.done} تکمیل · ${v.progress} در حال اجرا · ${v.total} کل</p>
                    </div>`;
            }).join('');
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[ch]);
        }

        function onMonitorRegionChange() {
            document.getElementById('regionHint').innerText = document.getElementById('regionFilter').value === 'all'
                ? 'برای فیلتر، روی منطقه کلیک کنید'
                : 'برای بازگشت، دوباره روی منطقه یا «نمایش همه» کلیک کنید';
            renderRegionProgress();
            filterStores();
        }

        function toggleMonitorRegion(name) {
            const sel = document.getElementById('regionFilter');
            sel.value = sel.value === name ? 'all' : name;
            document.getElementById('regionHint').innerText = sel.value === 'all'
                ? 'برای فیلتر، روی منطقه کلیک کنید'
                : 'برای بازگشت، دوباره روی منطقه یا «نمایش همه» کلیک کنید';
            renderRegionProgress();
            filterStores();
        }

        function resetMonitorRegion() {
            document.getElementById('regionFilter').value = 'all';
            document.getElementById('regionHint').innerText = 'برای فیلتر، روی منطقه کلیک کنید';
            renderRegionProgress();
            filterStores();
        }

        function renderGrid(stores) {
            const grid = document.getElementById('statsGrid');
            grid.innerHTML = stores.map(store => {
                const isDone = !!store.isLocked;
                const isInProgress = !isDone && !!store.auditor;
                const cls = isDone ? 'tile-done' : isInProgress ? 'tile-progress' : 'tile-pending';
                const label = isDone ? 'تکمیل' : isInProgress ? 'در حال انجام' : 'در انتظار';
                const date = isDone && store.auditDate
                    ? `<span class="tile-date">📅 ${escapeHtml(store.auditDate)}</span>` : '';
                return `
                    <div class="store-tile status-card ${cls}" title="${escapeHtml(store.plant)} - ${escapeHtml(store.storeName || '')} (${label})">
                        <span class="tile-code">${escapeHtml(store.plant)}</span>
                        <span class="tile-name">${escapeHtml(store.storeName || '')}</span>
                        <span class="tile-label">${label}</span>
                        ${date}
                    </div>`;
            }).join('');
            if (!stores.length) {
                grid.innerHTML = '<div class="col-span-full text-center py-16 text-slate-400">فروشگاهی یافت نشد.</div>';
            }
        }

        loadMonitoring();
        setInterval(loadMonitoring, 15000);
    </script>
    <script src="/auth-ui.js"></script>
    <script src="vf-apply.js"></script>
</body>
</html>
