<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مانیتورینگ انبارگردانی</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-card { transition: all 0.3s ease; }
        .status-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8">

    <header class="mb-10 flex flex-col md:flex-row justify-between items-center bg-slate-800 p-6 rounded-3xl shadow-lg border border-slate-700 gap-4">
        <h1 class="text-xl font-bold text-white">مانیتورینگ وضعیت انبارگردانی</h1>
        <input type="text" id="searchInput" oninput="filterStores()" placeholder="جستجوی کد یا نام فروشگاه..." class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 w-full md:w-64 text-sm focus:outline-none focus:border-orange-500">
        <button onclick="window.location.href='/'" class="bg-slate-700 hover:bg-slate-600 px-5 py-2 rounded-xl text-sm font-bold">بازگشت به پنل</button>
    </header>

    <div id="statsGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3"></div>

    <script>
        let allStores = [];

        async function loadMonitoring() {
            try {
                const res = await fetch('/api/monitoring/status');
                const data = await res.json();
                allStores = data.sort((a, b) => a.plant.localeCompare(b.plant));
                renderGrid(allStores);
            } catch (e) {
                document.getElementById('statsGrid').innerHTML = `<div class="col-span-full text-center py-20 text-rose-400">خطا: ${e.message}</div>`;
            }
        }

        function filterStores() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allStores.filter(s => s.plant.includes(query) || s.storeName.toLowerCase().includes(query));
            renderGrid(filtered);
        }

        function renderGrid(stores) {
            const grid = document.getElementById('statsGrid');
            grid.innerHTML = '';
            stores.forEach(store => {
                const isDone = store.isLocked;
                // اگر انبارگردان ست شده باشد یعنی در حال انجام است (زرد)
                const isInProgress = !isDone && (store.auditor !== null);
                
                let bgColor = 'bg-rose-950/20 border-rose-800';
                let textColor = 'text-rose-400';
                let label = 'در انتظار';

                if (isDone) {
                    bgColor = 'bg-emerald-600/20 border-emerald-500';
                    textColor = 'text-emerald-400';
                    label = 'تکمیل';
                } else if (isInProgress) {
                    bgColor = 'bg-amber-600/20 border-amber-500';
                    textColor = 'text-amber-400';
                    label = 'در حال انجام';
                }

                grid.innerHTML += `
                    <div class="status-card border ${bgColor} rounded-xl p-3 shadow-sm text-center">
                        <div class="font-bold text-lg mb-1">${store.plant}</div>
                        <div class="text-[10px] truncate opacity-70">${store.storeName}</div>
                        <div class="mt-2 text-[9px] font-bold ${textColor}">
                            ${label}
                        </div>
                    </div>
                `;
            });
        }
        loadMonitoring();
    </script>
</body>
</html>
