<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مانیتورینگ انبارگردانی</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-card { transition: all 0.3s ease; }
        .status-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8">

    <header class="mb-6 flex flex-col lg:flex-row justify-between items-center bg-slate-800 p-6 rounded-3xl shadow-lg border border-slate-700 gap-4">
        <h1 class="text-xl font-bold text-white">مانیتورینگ وضعیت انبارگردانی</h1>
        <div class="flex flex-wrap items-center gap-2">
            <select id="regionFilter" onchange="filterStores()" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-orange-500">
                <option value="all">همه مناطق</option>
            </select>
            <input type="text" id="searchInput" oninput="filterStores()" placeholder="جستجوی کد یا نام فروشگاه..." class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 w-full md:w-56 text-xs focus:outline-none focus:border-orange-500">
            <a href="/api/monitoring/export" class="bg-sky-700 hover:bg-sky-600 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap">📥 اکسل کلی</a>
            <button onclick="loadMonitoring()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-xs font-bold">🔄 بروزرسانی</button>
            <button onclick="window.location.href='/'" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-xs font-bold">بازگشت به پنل</button>
            <a href="http://localhost:3001/" class="bg-indigo-700 hover:bg-indigo-600 px-4 py-2 rounded-xl text-xs font-bold">🛡️ پنل مدیریت</a>
        </div>
    </header>

    <!-- شمارنده وضعیتها -->
    <div class="grid grid-cols-3 gap-4 mb-8 max-w-3xl mx-auto">
        <div class="bg-emerald-900/40 border border-emerald-600 rounded-2xl p-4 text-center">
            <p class="text-2xl font-bold text-emerald-400" id="countDone">۰</p>
            <p class="text-xs text-emerald-300 mt-1">تکمیل شده</p>
        </div>
        <div class="bg-amber-900/40 border border-amber-600 rounded-2xl p-4 text-center">
            <p class="text-2xl font-bold text-amber-400" id="countProgress">۰</p>
            <p class="text-xs text-amber-300 mt-1">در حال انجام</p>
        </div>
        <div class="bg-rose-900/40 border border-rose-600 rounded-2xl p-4 text-center">
            <p class="text-2xl font-bold text-rose-400" id="countPending">۰</p>
            <p class="text-xs text-rose-300 mt-1">در انتظار</p>
        </div>
    </div>

    <!-- پیشرفت مناطق -->
    <div class="max-w-5xl mx-auto mb-8 bg-slate-800 border border-slate-700 rounded-3xl p-5 shadow-xl">
        <h2 class="text-sm font-bold text-white mb-4">📈 پیشرفت انبارگردانی به تفکیک منطقه</h2>
        <div id="regionProgress" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3"></div>
    </div>

    <div id="statsGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3"></div>

    <script>
        let allStores = [];

        async function loadMonitoring() {
            try {
                const res = await fetch('/api/monitoring/status');
                const data = await res.json();
                allStores = data.sort((a, b) => a.plant.localeCompare(b.plant));

                // پر کردن لیست مناطق
                const select = document.getElementById('regionFilter');
                const current = select.value;
                const regions = [...new Set(allStores.map(s => s.region).filter(Boolean))];
                select.innerHTML = '<option value="all">همه مناطق</option>' +
                    regions.map(r => `<option value="${r}">${r}</option>`).join('');
                select.value = current || 'all';

                filterStores();
            } catch (e) {
                document.getElementById('statsGrid').innerHTML = `<div class="col-span-full text-center py-20 text-rose-400">خطا: ${e.message}</div>`;
            }
        }

        function filterStores() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const region = document.getElementById('regionFilter').value;
            const filtered = allStores.filter(s =>
                (region === 'all' || s.region === region) &&
                (s.plant.includes(query) || s.storeName.toLowerCase().includes(query))
            );

            document.getElementById('countDone').innerText = filtered.filter(s => s.isLocked).length;
            document.getElementById('countProgress').innerText = filtered.filter(s => !s.isLocked && s.auditor).length;
            document.getElementById('countPending').innerText = filtered.filter(s => !s.isLocked && !s.auditor).length;

            renderRegionProgress();
            renderGrid(filtered);
        }

        function renderRegionProgress() {
            const box = document.getElementById('regionProgress');
            const byRegion = {};
            allStores.forEach(s => {
                const r = s.region || 'سایر';
                if (!byRegion[r]) byRegion[r] = { total: 0, done: 0, progress: 0 };
                byRegion[r].total++;
                if (s.isLocked) byRegion[r].done++;
                else if (s.auditor) byRegion[r].progress++;
            });

            box.innerHTML = Object.entries(byRegion).map(([name, v]) => {
                const pct = v.total ? Math.round(v.done / v.total * 100) : 0;
                const barColor = pct === 100 ? 'bg-emerald-500' : pct >= 50 ? 'bg-sky-500' : 'bg-orange-500';
                return `
                    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-3">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-white">${name}</span>
                            <span class="text-xs font-bold ${pct === 100 ? 'text-emerald-400' : 'text-orange-400'}">${pct}٪</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden border border-slate-700">
                            <div class="${barColor} h-full transition-all duration-500" style="width:${pct}%"></div>
                        </div>
                        <p class="text-[10px] text-slate-400 mt-2">${v.done} تکمیل · ${v.progress} در حال اجرا · ${v.total} کل</p>
                    </div>
                `;
            }).join('');
        }

        function renderGrid(stores) {
            const grid = document.getElementById('statsGrid');
            grid.innerHTML = '';
            stores.forEach(store => {
                const isDone = store.isLocked;
                const isInProgress = !isDone && (store.auditor !== null);

                let bgColor = 'bg-rose-950/20 border-rose-800';
                let textColor = 'text-rose-400';
                let label = 'در انتظار';

                if (isDone) {
                    bgColor = 'bg-emerald-600/20 border-emerald-500';
                    textColor = 'text-emerald-400';
                    label = 'تکمیل';
                } else if (isInProgress) {
                    bgColor = 'bg-amber-600/20 border-amber-500';
                    textColor = 'text-amber-400';
                    label = 'در حال انجام';
                }

                grid.innerHTML += `
                    <div class="status-card border ${bgColor} rounded-xl p-3 shadow-sm text-center">
                        <div class="font-bold text-lg mb-1">${store.plant}</div>
                        <div class="text-[10px] truncate opacity-70">${store.storeName}</div>
                        <div class="mt-2 text-[9px] font-bold ${textColor}">${label}</div>
                    </div>
                `;
            });
        }

        loadMonitoring();
        setInterval(loadMonitoring, 15000);
    </script>
</body>
</html>
