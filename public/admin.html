<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت انبارگردانی</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">

    <header class="mb-8 flex flex-col lg:flex-row justify-between items-center bg-slate-800 p-6 rounded-3xl shadow-lg border border-slate-700 gap-4">
        <div>
            <h1 class="text-2xl font-bold text-white">🛡️ پنل مدیریت کل انبارگردانی</h1>
            <p class="text-xs text-slate-400 mt-1">نمای کلی وضعیت تمام فروشگاههای زنجیره ای هفت</p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
            <a href="/api/monitoring/export" class="bg-sky-700 hover:bg-sky-600 px-4 py-2 rounded-xl text-xs font-bold">📥 خروجی اکسل کلی</a>
            <a href="/monitoring.html" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-xs font-bold">📊 نمای خانه ای</a>
            <button onclick="loadAdmin()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-xs font-bold">🔄 بروزرسانی</button>
            <a href="/" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-xs font-bold">بازگشت به پنل</a>
        </div>
    </header>

    <!-- آمار کلی -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 max-w-5xl mx-auto">
        <div class="bg-slate-800 border border-slate-600 rounded-2xl p-4 text-center">
            <p class="text-2xl font-bold text-white" id="statTotal">۰</p>
            <p class="text-xs text-slate-400 mt-1">کل فروشگاهها</p>
        </div>
        <div class="bg-emerald-900/40 border border-emerald-600 rounded-2xl p-4 text-center">
            <p class="text-2xl font-bold text-emerald-400" id="statDone">۰</p>
            <p class="text-xs text-emerald-300 mt-1">تکمیل شده</p>
        </div>
        <div class="bg-amber-900/40 border border-amber-600 rounded-2xl p-4 text-center">
            <p class="text-2xl font-bold text-amber-400" id="statProgress">۰</p>
            <p class="text-xs text-amber-300 mt-1">در حال انجام</p>
        </div>
        <div class="bg-rose-900/40 border border-rose-600 rounded-2xl p-4 text-center">
            <p class="text-2xl font-bold text-rose-400" id="statPending">۰</p>
            <p class="text-xs text-rose-300 mt-1">در انتظار</p>
        </div>
    </div>

    <!-- فیلترها -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 mb-6 flex flex-wrap gap-3 items-center justify-between">
        <div class="flex flex-wrap gap-2">
            <button onclick="setFilter('all')" id="filterAll" class="filter-btn bg-slate-600 text-white px-4 py-2 rounded-xl text-xs font-bold">همه</button>
            <button onclick="setFilter('done')" id="filterDone" class="filter-btn bg-slate-700 px-4 py-2 rounded-xl text-xs font-bold">✅ تکمیل شده</button>
            <button onclick="setFilter('progress')" id="filterProgress" class="filter-btn bg-slate-700 px-4 py-2 rounded-xl text-xs font-bold">🟡 در حال اجرا</button>
            <button onclick="setFilter('pending')" id="filterPending" class="filter-btn bg-slate-700 px-4 py-2 rounded-xl text-xs font-bold">🔴 در انتظار</button>
        </div>
        <input type="text" id="searchInput" oninput="renderTable()" placeholder="جستجوی کد یا نام فروشگاه..." class="bg-slate-900 border border-slate-600 rounded-xl px-4 py-2 w-full md:w-72 text-xs focus:outline-none focus:border-orange-500">
    </div>

    <!-- جدول -->
    <div class="bg-slate-800 border border-slate-700 rounded-3xl shadow-2xl overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-right border-collapse min-w-[900px]">
                <thead>
                    <tr class="bg-slate-900 text-slate-400 text-xs border-b border-slate-700">
                        <th class="p-3 text-center">کد فروشگاه</th>
                        <th class="p-3">نام فروشگاه</th>
                        <th class="p-3 text-center">وضعیت</th>
                        <th class="p-3 text-center">پیشرفت</th>
                        <th class="p-3 text-center">فاقد</th>
                        <th class="p-3">تاریخ انبارگردانی</th>
                        <th class="p-3">انبارگردان</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody" class="divide-y divide-slate-700/60 text-sm"></tbody>
            </table>
        </div>
        <div class="p-4 text-center border-t border-slate-700">
            <button id="loadMoreBtn" onclick="visibleCount += 50; renderTable();" class="hidden bg-slate-700 hover:bg-slate-600 px-6 py-2 rounded-xl text-xs font-bold">نمایش ۵۰ فروشگاه بعدی</button>
            <p id="tableInfo" class="text-xs text-slate-500"></p>
        </div>
    </div>

    <script>
        let allStores = [];
        let currentFilter = 'all';
        let visibleCount = 50;

        async function loadAdmin() {
            try {
                const res = await fetch('/api/monitoring/status');
                const data = await res.json();
                allStores = data.sort((a, b) => a.plant.localeCompare(b.plant));

                document.getElementById('statTotal').innerText = allStores.length;
                document.getElementById('statDone').innerText = allStores.filter(s => s.isLocked).length;
                document.getElementById('statProgress').innerText = allStores.filter(s => !s.isLocked && s.auditor).length;
                document.getElementById('statPending').innerText = allStores.filter(s => !s.isLocked && !s.auditor).length;

                renderTable();
            } catch (e) {
                document.getElementById('adminTableBody').innerHTML = `<tr><td colspan="7" class="p-8 text-center text-rose-400">خطا: ${e.message}</td></tr>`;
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            visibleCount = 50;
            ['all', 'done', 'progress', 'pending'].forEach(f => {
                const btn = document.getElementById('filter' + f.charAt(0).toUpperCase() + f.slice(1));
                if (btn) {
                    btn.className = 'filter-btn px-4 py-2 rounded-xl text-xs font-bold ' +
                        (f === filter ? 'bg-slate-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600');
                }
            });
            renderTable();
        }

        function renderTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allStores.filter(s => {
                const matchQuery = s.plant.includes(query) || s.storeName.toLowerCase().includes(query);
                const status = s.isLocked ? 'done' : (s.auditor ? 'progress' : 'pending');
                return matchQuery && (currentFilter === 'all' || currentFilter === status);
            });

            const shown = filtered.slice(0, visibleCount);
            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = '';

            shown.forEach(store => {
                const isDone = store.isLocked;
                const isInProgress = !isDone && store.auditor;
                const statusStyle = isDone
                    ? 'bg-emerald-900/60 text-emerald-300 border-emerald-600'
                    : isInProgress
                        ? 'bg-amber-900/60 text-amber-300 border-amber-600'
                        : 'bg-rose-900/60 text-rose-300 border-rose-600';
                const statusText = isDone ? 'تکمیل شده' : isInProgress ? 'در حال اجرا' : 'در انتظار';
                const progress = store.equipmentCount
                    ? Math.round(store.checkedCount / store.equipmentCount * 100)
                    : 0;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-700/40">
                        <td class="p-3 text-center">
                            <a href="/?plant=${store.plant}" class="text-orange-400 font-bold hover:underline" title="باز کردن پنل انبارگردانی">${store.plant}</a>
                        </td>
                        <td class="p-3 text-slate-200">${store.storeName}</td>
                        <td class="p-3 text-center">
                            <span class="inline-block px-3 py-1 rounded-lg border text-[11px] font-bold ${statusStyle}">${statusText}</span>
                        </td>
                        <td class="p-3 text-center">
                            <div class="flex items-center justify-center gap-2">
                                <div class="w-16 bg-slate-900 h-1.5 rounded-full overflow-hidden border border-slate-600">
                                    <div class="${isDone ? 'bg-emerald-500' : 'bg-orange-500'} h-full" style="width:${progress}%"></div>
                                </div>
                                <span class="text-[11px] text-slate-400">${progress}٪</span>
                            </div>
                        </td>
                        <td class="p-3 text-center ${store.missingCount > 0 ? 'text-rose-400 font-bold' : 'text-slate-500'}">${store.missingCount || 0}</td>
                        <td class="p-3 text-xs text-slate-400">${store.auditDate || '-'}</td>
                        <td class="p-3 text-xs text-slate-300">${store.auditor || '-'}</td>
                    </tr>
                `;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-400">فروشگاهی یافت نشد.</td></tr>';
            }

            document.getElementById('tableInfo').innerText = `نمایش ${shown.length} از ${filtered.length} فروشگاه`;
            document.getElementById('loadMoreBtn').classList.toggle('hidden', visibleCount >= filtered.length);
        }

        loadAdmin();
        setInterval(loadAdmin, 15000);
    </script>
</body>
</html>
